<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--gold:#b8860b;--gold-d:#8a6508;--cream:#fff8e7;--ink:#3b2f1a;--line:#e6d6a8}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Sarabun','Noto Sans Myanmar',sans-serif;color:var(--ink);
       background:linear-gradient(180deg,#fff3cf,#fffaf0 40%);min-height:100vh}
  html[lang=my] body{line-height:1.8}
  .wrap{max-width:560px;margin:0 auto;padding:20px 16px 40px;position:relative}
  #lang{position:absolute;top:12px;right:12px;width:auto;margin:0;padding:6px 14px;
        font-size:14px;font-weight:600;border-radius:999px;background:#fff;color:var(--gold-d);
        border:1px solid var(--gold);cursor:pointer}
  #lang:hover{background:#fff0c2}
  .head{text-align:center;padding:34px 12px 10px}
  .head .lotus{font-size:40px}
  h1{margin:6px 0 4px;font-size:24px;color:var(--gold-d)}
  .sub{font-size:15px;opacity:.85}
  .info{background:#fff;border:1px solid var(--line);border-left:5px solid var(--gold);
        border-radius:12px;padding:14px 16px;margin:16px 0;font-size:15px;line-height:1.7}
  form{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;
       box-shadow:0 4px 16px rgba(184,134,11,.12)}
  label.t{display:block;font-weight:600;margin:16px 0 6px}
  label.t:first-child{margin-top:0}
  .req{color:#c0392b}
  input[type=text],input[type=tel],select{width:100%;padding:12px;font:inherit;
       border:1px solid #d9c98f;border-radius:10px;background:#fffdf6}
  input:focus,select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .opts{display:grid;gap:8px}
  .opt{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #d9c98f;
       border-radius:10px;cursor:pointer;background:#fffdf6}
  .opt:has(input:checked){background:#fff0c2;border-color:var(--gold);font-weight:600}
  .opt input{accent-color:var(--gold);width:18px;height:18px;flex-shrink:0}
  #submitBtn{width:100%;margin-top:22px;padding:14px;font:inherit;font-weight:700;font-size:17px;
         color:#fff;background:var(--gold);border:0;border-radius:12px;cursor:pointer}
  #submitBtn:hover{background:var(--gold-d)}
  #submitBtn:disabled{opacity:.6;cursor:wait}
  .err{color:#c0392b;font-size:14px;margin-top:10px;display:none;text-align:center}
  #done{display:none;text-align:center;background:#fff;border:1px solid var(--line);
        border-radius:16px;padding:36px 20px}
  #done .big{font-size:56px}
  #done h2{color:var(--gold-d);margin:8px 0}
</style>
</head>
<body>
<div class="wrap">
  <button type="button" id="lang">မြန်မာ</button>

  <div class="head">
    <div class="lotus">🪷</div>
    <h1 data-i18n="title"></h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>

  <div class="info">
    <div>📍 <b data-i18n="placeLbl"></b> <span data-i18n="placeVal"></span></div>
    <div>📅 <b data-i18n="dateLbl"></b> <span data-i18n="dateVal"></span>
         &nbsp;&nbsp;🕙 <b data-i18n="timeLbl"></b> <span data-i18n="timeVal"></span></div>
  </div>

  <form id="f" autocomplete="off">
    <label class="t"><span data-i18n="lblName"></span> <span class="req">*</span></label>
    <input type="text" name="name" required>

    <label class="t"><span data-i18n="lblCompany"></span> <span class="req">*</span></label>
    <div class="opts">
      <label class="opt"><input type="radio" name="company" value="บริษัท ภรณ์ทวีพริ้นติ้ง แอนด์ เทรดดิ้ง จำกัด (PTW)" required> <span data-i18n="coPTW"></span></label>
      <label class="opt"><input type="radio" name="company" value="บริษัท มาสเตอร์ คิทเช่น จำกัด"> <span data-i18n="coMK"></span></label>
    </div>

    <div id="deptBox" style="display:none">
    <label class="t"><span data-i18n="lblDept"></span> <span class="req">*</span></label>
    <select name="department">
      <option value="" data-i18n="deptPlaceholder"></option>
      <option>Accounting</option>
      <option>Engineering</option>
      <option>Human Resource</option>
      <option>Marketing</option>
      <option>Operation</option>
      <option>Partstown</option>
      <option>Service</option>
    </select>
    </div>

    <label class="t"><span data-i18n="lblPhone"></span> <span class="req">*</span></label>
    <input type="tel" name="phone" inputmode="numeric" maxlength="12" required>

    <label class="t"><span data-i18n="lblAttend"></span> <span class="req">*</span></label>
    <div class="opts">
      <label class="opt"><input type="radio" name="attend" value="สนใจเข้าร่วม" required> <span data-i18n="attendYes"></span></label>
      <label class="opt"><input type="radio" name="attend" value="ไม่สะดวกเข้าร่วม"> <span data-i18n="attendNo"></span></label>
    </div>

    <div class="err" id="err"></div>
    <button type="submit" id="submitBtn" data-i18n="submit"></button>
  </form>

  <div id="done">
    <div class="big">🙏</div>
    <h2 data-i18n="thanks"></h2>
    <p id="doneMsg"></p>
  </div>
</div>

<script>
const T = {
  th: {
    title: 'แบบสำรวจทอดกฐินสามัคคี 2569',
    subtitle: 'ทอดกฐินในนามบริษัท ประจำปี 2569',
    placeLbl: 'สถานที่:', placeVal: 'วัดบางพลีใหญ่กลาง อ.บางพลี จ.สมุทรปราการ',
    dateLbl: 'วัน:', dateVal: 'ศุกร์ที่ 27 ตุลาคม 2569',
    timeLbl: 'เวลา:', timeVal: '10.30 น.',
    coPTW: 'บริษัท ภรณ์ทวีพริ้นติ้ง แอนด์ เทรดดิ้ง จำกัด (PTW)',
    coMK: 'บริษัท มาสเตอร์ คิทเช่น จำกัด',
    lblName: 'ชื่อ-นามสกุล', lblCompany: 'บริษัท', lblDept: 'แผนก',
    deptPlaceholder: '-- เลือกแผนก --',
    lblPhone: 'เบอร์โทรศัพท์',
    lblAttend: 'ท่านสนใจร่วมทำบุญหรือไม่',
    attendYes: '🙏 สนใจเข้าร่วม', attendNo: 'ไม่สะดวกเข้าร่วม',
    submit: 'ส่งแบบสำรวจ', saving: 'กำลังบันทึก...',
    thanks: 'ขอบคุณที่ตอบแบบสำรวจ',
    doneMsg: 'บันทึกข้อมูลเรียบร้อยแล้ว ขออนุโมทนาบุญล่วงหน้าครับ/ค่ะ',
    doneUpd: 'อัปเดตข้อมูลของท่านเรียบร้อยแล้ว (พบเบอร์นี้เคยตอบแล้ว)',
    errDept: 'กรุณาเลือกแผนก',
    errPhone: 'กรุณากรอกเบอร์โทรให้ถูกต้อง (เช่น 0812345678)',
    errNet: 'ส่งข้อมูลไม่สำเร็จ กรุณาลองใหม่อีกครั้ง',
    langBtn: 'မြန်မာ'
  },
  my: {
    title: 'ကထိန်ပွဲတော် စစ်တမ်း ၂၅၆၉',
    subtitle: 'ကုမ္ပဏီအမည်ဖြင့် ကထိန်ခင်းလှူဒါန်းခြင်း (၂၅၆၉ ခုနှစ်)',
    placeLbl: 'နေရာ:', placeVal: 'ဝပ်ဘန်ဖလီးယိုင်ကလာင် (วัดบางพลีใหญ่กลาง) ဘန်ဖလီခရိုင်၊ စမွတ်ပရကန်ပြည်နယ်',
    dateLbl: 'ရက်စွဲ:', dateVal: 'သောကြာနေ့ ၂၅၆၉ ခုနှစ် အောက်တိုဘာလ ၂၇ ရက်',
    timeLbl: 'အချိန်:', timeVal: 'နံနက် ၁၀:၃၀ နာရီ',
    coPTW: 'Porntawee Printing and Trading Co., Ltd.',
    coMK: 'MASTER KITCHEN CO., LTD.',
    lblName: 'အမည်-မျိုးရိုးအမည်', lblCompany: 'ကုမ္ပဏီ', lblDept: 'ဌာန',
    deptPlaceholder: '-- ဌာန ရွေးချယ်ပါ --',
    lblPhone: 'ဖုန်းနံပါတ်',
    lblAttend: 'ကုသိုလ်ပြုရန် စိတ်ဝင်စားပါသလား',
    attendYes: '🙏 စိတ်ဝင်စားပါသည် (ပါဝင်မည်)', attendNo: 'မအားလပ်ပါ (မပါဝင်နိုင်ပါ)',
    submit: 'စစ်တမ်း ပေးပို့မည်', saving: 'သိမ်းဆည်းနေသည်...',
    thanks: 'စစ်တမ်းဖြေဆိုသည့်အတွက် ကျေးဇူးတင်ပါသည်',
    doneMsg: 'အချက်အလက်များ သိမ်းဆည်းပြီးပါပြီ။ ကုသိုလ်ကောင်းမှုကို ကြိုတင်၍ သာဓုခေါ်ပါသည်။',
    doneUpd: 'သင့်အချက်အလက်ကို ပြင်ဆင်ပြီးပါပြီ (ဤဖုန်းနံပါတ်ဖြင့် ယခင်ဖြေဆိုပြီးဖြစ်သည်)',
    errDept: 'ဌာနကို ရွေးချယ်ပါ',
    errPhone: 'ဖုန်းနံပါတ်ကို မှန်ကန်စွာ ထည့်ပါ',
    errNet: 'ပေးပို့၍ မအောင်မြင်ပါ။ ထပ်မံကြိုးစားပါ',
    langBtn: 'ไทย'
  }
};

// ===== ใส่ URL ของ Web App (ลงท้ายด้วย /exec) ที่ได้จาก Apps Script ตรงนี้ =====
const API_URL = 'https://script.google.com/macros/s/AKfycbzRHLY69PaTe-f11KFHX5Rz2pJEvjJBGN5qeCUHQE_AoYC9v68i1d7RpoCIT2grhT_Ikg/exec';
// ==========================================================================

let lang = 'th';
let doneKey = 'doneMsg';
const f = document.getElementById('f');
const err = document.getElementById('err');
const btn = document.getElementById('submitBtn');
const langBtn = document.getElementById('lang');
const deptBox = document.getElementById('deptBox');
const MASTER = 'บริษัท มาสเตอร์ คิทเช่น จำกัด';

function t(k){ return T[lang][k]; }

function applyLang(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.getElementById('doneMsg').textContent = t(doneKey);
  langBtn.textContent = t('langBtn');
  err.style.display = 'none';
}

function setLang(l){
  lang = l;
  try { localStorage.setItem('lang', l); } catch(e) {}
  applyLang();
}

langBtn.addEventListener('click', () => setLang(lang === 'th' ? 'my' : 'th'));

f.querySelectorAll('input[name=company]').forEach(r => r.addEventListener('change', () => {
  const isMaster = (f.company.value === MASTER);
  deptBox.style.display = isMaster ? 'block' : 'none';
  if (!isMaster) f.department.value = '';
}));

function showErr(m){ err.textContent = m; err.style.display = 'block'; }

f.addEventListener('submit', e => {
  e.preventDefault();
  err.style.display = 'none';

  const d = {
    name: f.name.value.trim(),
    department: f.department.value.trim(),
    company: f.company.value.trim(),
    phone: f.phone.value.replace(/[^0-9]/g,''),
    attend: f.attend.value
  };

  if (d.company === MASTER && !d.department) return showErr(t('errDept'));
  if (!/^0\d{8,9}$/.test(d.phone)) return showErr(t('errPhone'));

  btn.disabled = true; btn.textContent = t('saving');
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(d)
  })
    .then(r => r.json())
    .then(res => {
      if (!res.ok) throw new Error('server');
      f.style.display = 'none';
      doneKey = res.updated ? 'doneUpd' : 'doneMsg';
      applyLang();
      document.getElementById('done').style.display = 'block';
      window.scrollTo(0,0);
    })
    .catch(() => {
      btn.disabled = false; btn.textContent = t('submit');
      showErr(t('errNet'));
    });
});

try { const s = localStorage.getItem('lang'); if (s === 'my' || s === 'th') lang = s; } catch(e) {}
applyLang();
</script>
</body>
</html>
